# ─────────────────────────────────────────────
# Auto-assign windows to workspaces
# (equivalent to i3 assign + for_window workspace)
# ─────────────────────────────────────────────

# Obsidian → workspace 6
windowrule {
  name = obsidian
  workspace = 6
  match:class = obsidian
}

# Discord + Telegram + Pachca → workspace 7
windowrule {
  name = TelegramDesktop
  workspace = 7
  group = set
  match:class = ^(org\.telegram\.desktop)$
}

windowrule {
  name = Discord
  workspace = 7
  group = set
  match:class = discord
}

windowrule {
  name = pachca
  workspace = 7
  group = set
  match:class = Pachca
}

windowrule {
  name = Keet
  workspace = 7
  group = set
  match:class = Keet
}

# Spotify → workspace 8
windowrule {
  name = Spotify
  workspace = 8
  match:class = Spotify
}

# OBS Studio → workspace 10
windowrule {
  name = obs
  workspace = 10
  match:class = com.obsproject.Studio
}

# AmneziaVPN → workspace 11
windowrule {
  name = amneziavpn
  float = off
  workspace = 11
  match:class = AmneziaVPN
}

# v2rayN → workspace 11
windowrule {
  name = v2rayN
  workspace = 11
  match:class = v2rayN
}


# throne → workspace 11
windowrule {
  name = throne
  workspace = 11
  match:class =  throne
}

windowrule {
  name = windowrule-1
  suppress_event = maximize
  match:class = .*
}


windowrule {
  name = windowrule-2
  float = on
  pin = on
  match:title = ^(Picture(-|\s)in(-|\s)(p|P)icture)$
}


windowrule {
  name = windowrule-3
  float = on
  size = (monitor_w*0.5) (monitor_h*0.5)
  match:class = org.pulseaudio.pavucontrol
}

windowrule {
  name = tilix
  opacity = 0.95 0.95
  match:class = tilix
}

windowrule {
  name = windowrule-4
  float = on
  size = (monitor_w*0.5) (monitor_h*0.5)
  match:class = nemo
}

windowrule {
  name = satty
  float = on
  size = (monitor_w*0.75) (monitor_h*0.75)
  match:class = com.gabm.satty
}


windowrule {
  name = TelegramDesktopMediaViewer
  fullscreen = off
  match:class = org.telegram.desktop
  match:title = ^Media viewer$
}

